<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Validator - Free Online Tool | niDar Tools</title>
<meta name="author" content="niDar Marketing And Services">
<meta name="description" content="Free online JSON Formatter and Validator. Beautify, minify and validate JSON instantly in your browser. 100% client-side and secure.">
<meta name="keywords" content="JSON Formatter, JSON Validator, JSON Beautifier, JSON Minifier, niDar Tools">
<meta name="theme-color" content="#0d6efd">
<style>
  :root{
    --bg:#f8f9fa; --card:#ffffff; --text:#212529; --muted:#6c757d;
    --border:#e2e6ea; --primary:#0d6efd; --primary-dark:#0b5ed7;
    --err:#dc3545; --ok:#198754;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --card:#181b21; --text:#e9ecef; --muted:#9aa4af;
    --border:#2a2f37; --primary:#3d8bfd; --primary-dark:#2a72e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); transition:background .2s,color .2s;
  }
  main{max-width:1000px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:1.6rem;margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:20px;font-size:.95rem;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  button.action{
    background:var(--primary); color:#fff; border:none; padding:9px 16px;
    border-radius:8px; cursor:pointer; font-size:.9rem; font-weight:600;
  }
  button.action:hover{background:var(--primary-dark);}
  button.secondary{
    background:transparent; color:var(--text); border:1px solid var(--border);
    padding:9px 16px; border-radius:8px; cursor:pointer; font-size:.9rem;
  }
  .grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:800px){.grid{grid-template-columns:1fr 1fr;}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .panel-head{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:.85rem;color:var(--muted);}
  textarea, pre{
    width:100%; height:420px; border:none; resize:vertical; padding:14px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace; font-size:.85rem;
    background:transparent; color:var(--text); outline:none; margin:0; white-space:pre-wrap; word-break:break-word; overflow:auto;
  }
  .status{padding:8px 14px;font-size:.85rem;border-top:1px solid var(--border);}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--muted);}
  .stats b{color:var(--text);}
  .string{color:#198754;} .number{color:#0d6efd;} .boolean{color:#e8590c;} .null{color:#adb5bd;} .key{color:#8c1cff;font-weight:600;}
  [data-theme="dark"] .string{color:#7ee2a8;} [data-theme="dark"] .number{color:#7cb8ff;}
  [data-theme="dark"] .boolean{color:#ffa156;} [data-theme="dark"] .key{color:#c792ea;}
</style>
<link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <h1>JSON Formatter & Validator</h1>
  <p class="sub">Beautify, minify and validate JSON instantly. 100% in your browser — your data never leaves your device.</p>

  <div class="toolbar">
    <button class="action" id="formatBtn">Format / Beautify</button>
    <button class="secondary" id="minifyBtn">Minify</button>
    <button class="secondary" id="copyBtn">Copy Output</button>
    <button class="secondary" id="clearBtn">Clear</button>
    <button class="secondary" id="sampleBtn">Load Sample</button>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head">Input JSON</div>
      <textarea id="input" placeholder='Paste your JSON here, e.g. {"name":"niDar","tools":10}'></textarea>
    </div>
    <div class="panel">
      <div class="panel-head">Output</div>
      <pre id="output"></pre>
      <div class="status" id="status">Waiting for input…</div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
</main>

<div id="site-footer"></div>

<script src="/assets/js/common.js"></script>
<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const stats = document.getElementById('stats');
  function syntaxHighlight(json){
    json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g, function(match){
      let cls = 'number';
      if(/^"/.test(match)){
        cls = /:$/.test(match) ? 'key' : 'string';
      } else if(/true|false/.test(match)){
        cls = 'boolean';
      } else if(/null/.test(match)){
        cls = 'null';
      }
      return '<span class="'+cls+'">'+match+'</span>';
    });
  }

  function updateStats(obj, raw){
    try{
      const keys = JSON.stringify(obj).match(/"[^"]+":/g) || [];
      stats.innerHTML =
        '<span><b>' + raw.length + '</b> characters</span>' +
        '<span><b>' + (new Blob([raw]).size) + '</b> bytes</span>' +
        '<span><b>' + keys.length + '</b> keys</span>';
    }catch(e){ stats.innerHTML=''; }
  }

  function format(){
    const val = input.value.trim();
    if(!val){ status.textContent='Waiting for input…'; status.className='status'; output.textContent=''; stats.innerHTML=''; return; }
    try{
      const obj = JSON.parse(val);
      const pretty = JSON.stringify(obj, null, 2);
      output.innerHTML = syntaxHighlight(pretty);
      status.textContent = '✓ Valid JSON';
      status.className = 'status ok';
      updateStats(obj, pretty);
    }catch(e){
      output.textContent = '';
      status.textContent = '✗ Invalid JSON — ' + e.message;
      status.className = 'status err';
      stats.innerHTML='';
    }
  }

  function minify(){
    const val = input.value.trim();
    if(!val){ return; }
    try{
      const obj = JSON.parse(val);
      const min = JSON.stringify(obj);
      output.innerHTML = syntaxHighlight(min);
      status.textContent = '✓ Valid JSON (minified)';
      status.className = 'status ok';
      updateStats(obj, min);
    }catch(e){
      status.textContent = '✗ Invalid JSON — ' + e.message;
      status.className = 'status err';
    }
  }

  document.getElementById('formatBtn').addEventListener('click', format);
  document.getElementById('minifyBtn').addEventListener('click', minify);
  document.getElementById('clearBtn').addEventListener('click', () => {
    input.value=''; output.textContent=''; status.textContent='Waiting for input…'; status.className='status'; stats.innerHTML='';
  });
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = output.textContent || output.innerText;
    if(!text) return;
    navigator.clipboard.writeText(text).then(()=>{
      const orig = status.textContent;
      status.textContent = 'Copied to clipboard!';
      setTimeout(()=>{ status.textContent = orig; }, 1500);
    });
  });
  document.getElementById('sampleBtn').addEventListener('click', () => {
    input.value = JSON.stringify({
      site:"niDar Tools",
      tools:10,
      categories:["Image","PDF","Calculator","Developer"],
      free:true,
      contact:{email:"nidarmarketingandservices@gmail.com"}
    }, null, 2);
    format();
  });

  input.addEventListener('input', () => {
    clearTimeout(window._t);
    window._t = setTimeout(format, 250);
  });
</script>
</body>
</html>
