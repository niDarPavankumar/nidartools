<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Editor – Edit, Annotate & Manage PDFs | niDar Tools</title>
    <meta name="description" content="Pro PDF Editor by niDar Tools. Edit, annotate, draw, highlight, sign, organize and manage PDF files directly in your browser.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nidartools.com/pdf-editor/">
    
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF Engine Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="pdfed-page">

    <!-- COMMON HEADER -->
    <div id="site-header"></div>

    <main class="pdf-hero">
        <div class="pdf-hero-content">
            <div>
                <span class="pdfed-badge">📝 Pro PDF Tool</span>
                <h1 class="tool-title">Pro PDF <span>Editor</span></h1>
                <p class="tool-subtitle">Edit, annotate, and manage your PDF documents instantly.</p>
            </div>
            <div class="privacy-badge">🔒 100% Private (Browser-based)</div>
        </div>
    </main>

    <section class="pdfed-workspace">
        <div class="workspace-card">
            
            <!-- TOOLBAR -->
            <div class="pdf-toolbar" role="toolbar">
                <button class="pdf-tool active" data-tool="select">↖ Select</button>
                <button class="pdf-tool" data-tool="text">T Text</button>
                <button class="pdf-tool" data-tool="signature">✍ Sign</button>
                <span class="pdf-toolbar-separator"></span>
                <button class="pdf-tool" data-action="rotate">↻ Rotate</button>
                <button class="pdf-tool pdf-action-danger" data-action="delete">🗑 Delete</button>
                <span class="pdf-toolbar-separator"></span>
                <button class="pdf-tool" id="zoomOut">−</button>
                <span id="zoomValue" style="min-width:48px; text-align:center; font-size:13px; font-weight:800;">100%</span>
                <button class="pdf-tool" id="zoomIn">+</button>
                <span class="pdf-toolbar-spacer"></span>
                <button class="pdf-action" id="openPdf">📂 Open PDF</button>
                <button class="pdf-action pdf-action-primary" id="downloadPdf">⬇ Download</button>
                <input id="pdfInput" class="pdf-hidden-file" type="file" accept="application/pdf" hidden>
            </div>

            <!-- WORKSPACE -->
            <div class="pdf-workspace">
                
                <!-- SIDEBAR -->
                <aside class="pdf-sidebar">
                    <div class="pdf-sidebar-header">
                        <span class="pdf-sidebar-title">Pages</span>
                        <span class="pdf-page-count" id="pageCount">0 pages</span>
                    </div>
                    <div class="pdf-page-list" id="pageList">
                        <div class="pdf-empty-pages">Upload a PDF to view pages.</div>
                    </div>
                </aside>

                <!-- CANVAS -->
                <div class="pdf-canvas" id="pdfCanvas">
                    <!-- Upload Prompt -->
                    <div class="pdf-upload-card" id="uploadCard">
                        <div class="pdf-upload-icon">📄</div>
                        <h2>Start editing your PDF</h2>
                        <p>Drag and drop a PDF here, or select a PDF to open the editor.</p>
                        <button class="pdf-action pdf-action-primary" id="choosePdf">Choose PDF</button>
                    </div>

                    <!-- PDF Render Area -->
                    <div class="pdf-document" id="pdfDocument" style="display:none; padding:0; border:none; background:transparent;">
                        <!-- Canvas will be injected here by JS -->
                    </div>

                    <div class="pdf-status" id="pdfStatus">Ready</div>
                </div>
            </div>
        </div>
    </section>

    <!-- COMMON FOOTER -->
    <div id="site-footer"></div>

    <script src="/assets/js/common.js"></script>
    <script src="script.js"></script>
</body>
</html>
