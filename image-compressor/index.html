<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Image Compressor
-
niDar Tools

</title>

<meta
name="description"
content="Compress JPG PNG and WebP images online for free.">

<link
rel="canonical"
href="https://nidartools.com/image-compressor">

<link
rel="stylesheet"
href="../assets/css/style.css">

</head>

<body>

<header>

<div class="container">

<nav class="navbar nav">

<a
href="../"
class="logo">

niDar
<span>Tools</span>

</a>

<button
class="menu-btn"
aria-label="Menu">

☰

</button>

<ul
class="nav-links">

<li>
<a href="../">
Home
</a>
</li>

<li>
<a href="/about">
About
</a>
</li>

<li>
<a href="/contact">
Contact
</a>
</li>

<li>
<a href="/support">
Support
</a>
</li>

</ul>

</nav>

</div>

</header>

<main class="container">

<section class="hero">

<div class="container">

<span class="badge">

🖼️ Professional Image Compression

</span>

<h1>

Compress Images
Without Losing Quality

</h1>

<p>

Reduce JPG, PNG and WebP image size
directly in your browser.

Fast, secure and completely free.

</p>

</div>

</section>

<section class="card">

<h2>

Select Image

</h2>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

<div class="mt-20">

<label>

Compression Quality

</label>

<input
type="range"
id="quality"
min="10"
max="100"
value="80">

<p
id="qualityValue">

80%

</p>

</div>

<div
id="preview"
class="mt-20">

</div>

<button
id="compressBtn"
class="btn mt-20">

Compress Image

</button>


<div
id="result"
class="mt-30">

</div>

</section>

<footer>

<div class="container">

<p>

© 2026
niDar Tools

</p>

<p>

Fast • Secure • Free

</p>

</div>

</footer>


</main>

<script
src="../assets/js/image-compressor.js">

</script>

</body>

</html>
