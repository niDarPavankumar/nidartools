<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - niDar Tools</title>

<meta name="description" content="Create a free QR code for any link, text, or message. Customize size and color, then download as PNG. Everything runs in your browser.">
<meta name="keywords" content="qr code generator, free qr code, create qr code online">
<meta name="author" content="niDar Marketing And Services">

<link rel="canonical" href="https://nidartools.com/qr-generator/">

<!-- Absolute paths for Assets -->
<link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/style.css">

<!-- External JS Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  .color-picker-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .color-picker-wrapper input[type="color"] {
    width: 48px;
    height: 42px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
  }
</style>
</head>

<body>

<header class="header">
  <div class="container navbar">
    <a href="/" class="logo">niDar<span>Tools</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/support/">Support</a>
    </nav>
    <button class="btn btn-theme" id="themeToggle" aria-label="Toggle theme">🌙 Theme</button>
  </div>
</header>

<main class="container mt-40">

<section class="hero-card text-center mb-30">
  <h1>QR Code Generator</h1>
  
  <div class="mt-10">
    <a href="/content/qr-generator/" class="guide-link">
      <span class="icon">📖</span><span>Read Detailed Guide — Business Ideas →</span>
    </a>
  </div>

  <p class="mt-10">
    Enter any link, text, or contact detail — get an instant QR code.
  </p>
</section>

<section class="card mb-20">

  <h2>Text or Link</h2>
  <textarea id="qrText" rows="3" placeholder="e.g. https://nidartools.com" class="form-control mt-10"></textarea>

  <div class="grid mt-20">
    <div>
      <label>Size</label>
      <select id="qrSize" class="form-control mt-10">
        <option value="200">Small (200px)</option>
        <option value="300" selected>Medium (300px)</option>
        <option value="500">Large (500px)</option>
      </select>
    </div>
    <div>
      <label>Color</label>
      <div class="color-picker-wrapper mt-10">
        <input type="color" id="qrColor" value="#0d6efd">
        <span class="text-muted" style="font-size: 0.85rem;">Select QR Code Color</span>
      </div>
    </div>
  </div>

  <button id="genBtn" class="btn btn-primary mt-20">⚡ Generate QR Code</button>

  <p id="errorMsg" class="alert alert-danger hidden mt-20"></p>

</section>

<section class="card hidden text-center mb-40" id="resultCard">

  <h2>Your QR Code</h2>

  <div id="qrCanvas" class="flex-center mt-20 mb-20" style="justify-content:center; display:flex;"></div>

  <button id="downloadBtn" class="btn btn-primary">📥 Download High-Res PNG</button>

</section>

</main>

<footer class="footer">
  <div class="container text-center">
    <p>© 2026 niDar Tools. All Rights Reserved.</p>
    <p>Developed by <strong>niDar Marketing And Services</strong></p>
  </div>
</footer>

<script src="/assets/js/script.js"></script>
<script>
(function () {
  const qrText = document.getElementById('qrText');
  const qrSize = document.getElementById('qrSize');
  const qrColor = document.getElementById('qrColor');
  const genBtn = document.getElementById('genBtn');
  const resultCard = document.getElementById('resultCard');
  const qrCanvas = document.getElementById('qrCanvas');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorMsg = document.getElementById('errorMsg');

  function ensureScannableColor(hex) {
    let r = parseInt(hex.substr(1, 2), 16);
    let g = parseInt(hex.substr(3, 2), 16);
    let b = parseInt(hex.substr(5, 2), 16);
    let factor = 1;
    while ((0.299 * r + 0.587 * g + 0.114 * b) > 120 && factor > 0.1) {
      factor -= 0.05;
      r = Math.round(r * (1 - 0.05));
      g = Math.round(g * (1 - 0.05));
      b = Math.round(b * (1 - 0.05));
    }
    const toHex = (v) => v.toString(16).padStart(2, '0');
    return { hex: '#' + toHex(r) + toHex(g) + toHex(b), adjusted: factor < 1 };
  }

  genBtn.addEventListener('click', () => {
    errorMsg.classList.add('hidden');
    const text = qrText.value.trim();
    if (!text) {
      errorMsg.textContent = 'Please enter some text or a link.';
      errorMsg.classList.remove('hidden');
      return;
    }

    const safe = ensureScannableColor(qrColor.value);
    if (safe.adjusted) {
      errorMsg.textContent = 'Note: your chosen color was too light to scan reliably, so it was automatically darkened for this QR code.';
      errorMsg.classList.remove('hidden');
    }

    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, {
      text: text,
      width: parseInt(qrSize.value),
      height: parseInt(qrSize.value),
      colorDark: safe.hex,
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    resultCard.classList.remove('hidden');
    resultCard.scrollIntoView({ behavior: 'smooth' });
  });

  downloadBtn.addEventListener('click', () => {
    const srcCanvas = qrCanvas.querySelector('canvas');
    const srcImg = qrCanvas.querySelector('img');
    
    if (!srcCanvas && !srcImg) {
      errorMsg.textContent = 'Please generate a QR code first.';
      errorMsg.classList.remove('hidden');
      return;
    }

    const size = 2048;
    const out = document.createElement('canvas');
    out.width = size;
    out.height = size;

    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    const margin = Math.round(size * 0.08);

    if (srcCanvas) {
      ctx.drawImage(srcCanvas, margin, margin, size - margin * 2, size - margin * 2);
      triggerDownload(out);
    } else if (srcImg) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, margin, margin, size - margin * 2, size - margin * 2);
        triggerDownload(out);
      };
      img.src = srcImg.src;
    }
  });

  function triggerDownload(canvasElement) {
    const link = document.createElement('a');
    link.download = 'nidar_qrcode.png';
    link.href = canvasElement.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
})();
</script>

</body>
</html>
