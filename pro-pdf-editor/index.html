<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Editor - Edit, Sign & Annotate | niDar Tools</title>
    <meta name="description" content="Free, private, and powerful Pro PDF Editor. Edit text, add digital signatures, whiteout content, and annotate your PDF files directly in your browser.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="pdfed-page">

    <!-- COMMON HEADER -->
    <div id="site-header"></div>

    <div class="pro-app-container">
        
        <!-- TOP TOOLBAR -->
        <header class="top-toolbar">
            <div class="toolbar-left">
                <span class="app-logo">📝 Pro PDF</span>
            </div>
            
            <div class="toolbar-center global-tools">
                <button class="t-btn active" data-category="select">↖ Select</button>
                <button class="t-btn" data-category="text">T Text</button>
                <button class="t-btn" data-category="annotate">🖍 Annotate</button>
                <button class="t-btn" data-category="draw" style="display:none;">✎ Draw</button>
                <button class="t-btn" data-category="image">🖼 Image</button>
                <button class="t-btn" data-category="form" style="display:none;">☑ Form</button>
                <button class="t-btn" data-category="sign">✍ Sign</button>
            </div>

            <div class="toolbar-right">
                <button class="action-btn" id="openPdfBtn">📂 Open</button>
                <button class="action-btn primary" id="exportPdfBtn">⬇ Export</button>
                <input type="file" id="pdfInput" accept="application/pdf" hidden>
            </div>
        </header>

        <!-- MAIN WORKSPACE -->
        <main class="workspace-area">
            
            <!-- CANVAS CONTAINER -->
            <section class="canvas-section" id="canvasSection">
                <div class="upload-prompt" id="uploadPrompt">
                    <div class="icon">📄</div>
                    <h2>Start Editing your PDF</h2>
                    <p>Drag & Drop a file or click Open to begin.</p>
                </div>
                
                <div class="pdf-document-wrapper" id="pdfDocumentWrapper" style="display: none;">
                    <canvas id="mainRenderCanvas"></canvas>
                </div>
            </section>

            <!-- CONTEXTUAL PANEL -->
            <aside class="contextual-panel" id="contextualPanel" style="display: none;">
                <div class="context-header">
                    <h3 id="contextTitle">Page Selected</h3>
                    <button class="close-context" id="closeContext">✖</button>
                </div>
                <div class="context-body">
                    <div class="context-group">
                        <h4>Edit Page</h4>
                        <div class="tool-grid">
                            <button class="c-btn"><span class="icon">↻</span> Rotate</button>
                            <button class="c-btn danger"><span class="icon">🗑</span> Delete</button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- BOTTOM THUMBNAILS -->
        <footer class="bottom-thumbnails">
            <div class="thumbnails-track" id="thumbnailsTrack">
                <div class="empty-track">Upload PDF to see pages</div>
            </div>
        </footer>

    </div>

    <!-- SEO CONTENT AREA (Rendered from JSON) -->
    <div id="seoContentArea" class="seo-content-container">
        <!-- Content will be injected here by script.js -->
    </div>

    <!-- COMMON FOOTER -->
    <div id="site-footer"></div>

    <script src="/assets/js/common.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
