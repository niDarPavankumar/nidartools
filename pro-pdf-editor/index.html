<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Editor | niDar Tools</title>
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- External Libraries (Will be handled by engine modules later) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="pdfed-page">

    <!-- COMMON HEADER -->
    <div id="site-header"></div>

    <div class="pro-app-container">
        
        <!-- TOP TOOLBAR -->
        <header class="top-toolbar">
            <div class="toolbar-left">
                <span class="app-logo">📝 Pro PDF</span>
            </div>
            
            <div class="toolbar-center global-tools">
                <button class="t-btn active" data-category="select">↖ Select</button>
                <button class="t-btn" data-category="text">T Text</button>
                <button class="t-btn" data-category="annotate">🖍 Annotate</button>
                <button class="t-btn" data-category="draw">✎ Draw</button>
                <button class="t-btn" data-category="image">🖼 Image</button>
                <button class="t-btn" data-category="form">☑ Form</button>
                <button class="t-btn" data-category="sign">✍ Sign</button>
            </div>

            <div class="toolbar-right">
                <button class="action-btn" id="openPdfBtn">📂 Open</button>
                <button class="action-btn primary" id="exportPdfBtn">⬇ Export</button>
                <input type="file" id="pdfInput" accept="application/pdf" hidden>
            </div>
        </header>

        <!-- MAIN WORKSPACE -->
        <main class="workspace-area">
            
            <!-- CANVAS CONTAINER -->
            <section class="canvas-section" id="canvasSection">
                <div class="upload-prompt" id="uploadPrompt">
                    <div class="icon">📄</div>
                    <h2>Start Editing your PDF</h2>
                    <p>Drag & Drop a file or click Open to begin.</p>
                </div>
                
                <!-- Engine will render PDF here -->
                <div class="pdf-document-wrapper" id="pdfDocumentWrapper" style="display: none;">
                    <canvas id="mainRenderCanvas"></canvas>
                </div>
            </section>

            <!-- CONTEXTUAL MENU (Right Panel) -->
            <aside class="contextual-panel" id="contextualPanel" style="display: none;">
                
                <div class="context-header">
                    <h3 id="contextTitle">Page 2 Selected</h3>
                    <button class="close-context" id="closeContext">✖</button>
                </div>

                <div class="context-body">
                    <!-- Page Edit Tools -->
                    <div class="context-group">
                        <h4>Edit Page</h4>
                        <div class="tool-grid">
                            <button class="c-btn"><span class="icon">✂</span> Crop</button>
                            <button class="c-btn"><span class="icon">↻</span> Rotate</button>
                            <button class="c-btn"><span class="icon">⤢</span> Resize</button>
                            <button class="c-btn"><span class="icon">⎘</span> Duplicate</button>
                            <button class="c-btn"><span class="icon">📤</span> Extract</button>
                            <button class="c-btn danger"><span class="icon">🗑</span> Delete</button>
                        </div>
                    </div>

                    <!-- Insert Tools -->
                    <div class="context-group">
                        <h4>Insert</h4>
                        <div class="tool-list">
                            <button class="c-list-btn">T Add Text</button>
                            <button class="c-list-btn">🖼 Add Image</button>
                            <button class="c-list-btn">✍ Add Signature</button>
                            <button class="c-list-btn">◇ Add Shape</button>
                            <button class="c-list-btn">💮 Add Stamp</button>
                        </div>
                    </div>
                </div>

            </aside>
        </main>

        <!-- BOTTOM THUMBNAILS -->
        <footer class="bottom-thumbnails">
            <div class="thumbnails-track" id="thumbnailsTrack">
                <div class="empty-track">Upload PDF to see pages</div>
            </div>
        </footer>

    </div>

    <!-- COMMON FOOTER -->
    <div id="site-footer"></div>

    <script src="/assets/js/common.js"></script>
    <script src="script.js"></script>
    
    <!-- Engine Modules (To be built in Phase 2) -->
    <!-- 
    <script src="engine/pdf-renderer.js"></script>
    <script src="engine/page-manager.js"></script>
    -->
</body>
</html>
