<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - niDar Tools</title>

<meta name="description" content="Create a free QR code for any link, text, or message. Customize size and color, then download as PNG. Everything runs in your browser.">
<meta name="keywords" content="qr code generator, free qr code, create qr code online">

<link rel="canonical" href="https://nidartools.com/qr-generator.html">
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<header>
  <div class="container nav">
    <h2>niDar Tools</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="/about">About</a>
      <a href="contact.html">Contact</a>
      <a href="support.html">Support</a>
    </nav>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1>QR Code Generator</h1>

  <p>
    Enter any link, text, or contact detail — get an instant QR code.
  </p>
</section>

<section class="card">

  <h2>Text or Link</h2>
  <textarea id="qrText" rows="3" placeholder="e.g. https://nidartools.com"></textarea>

  <div class="grid mt-20">
    <div>
      <label>Size</label>
      <select id="qrSize">
        <option value="200">Small (200px)</option>
        <option value="300" selected>Medium (300px)</option>
        <option value="500">Large (500px)</option>
      </select>
    </div>
    <div>
      <label>Color</label>
      <input type="color" id="qrColor" value="#0d6efd">
    </div>
  </div>

  <button id="genBtn" class="btn mt-20">Generate QR Code</button>

  <p id="errorMsg" class="alert alert-danger hidden mt-20"></p>

</section>

<section class="card hidden text-center" id="resultCard">

  <h2>Your QR Code</h2>

  <div id="qrCanvas" class="flex-center mt-20"></div>

  <button id="downloadBtn" class="btn mt-20">Download PNG</button>

</section>

</main>

<footer>

<p>
© 2026 niDar Tools
</p>

<p>
Developed by
<strong>niDar Marketing And Services</strong>
</p>

</footer>

<script src="assets/js/script.js"></script>
<script>
(function () {
  const qrText = document.getElementById('qrText');
  const qrSize = document.getElementById('qrSize');
  const qrColor = document.getElementById('qrColor');
  const genBtn = document.getElementById('genBtn');
  const resultCard = document.getElementById('resultCard');
  const qrCanvas = document.getElementById('qrCanvas');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorMsg = document.getElementById('errorMsg');

  function colorLuminance(hex) {
    const r = parseInt(hex.substr(1, 2), 16);
    const g = parseInt(hex.substr(3, 2), 16);
    const b = parseInt(hex.substr(5, 2), 16);
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  function ensureScannableColor(hex) {
    let r = parseInt(hex.substr(1, 2), 16);
    let g = parseInt(hex.substr(3, 2), 16);
    let b = parseInt(hex.substr(5, 2), 16);
    let factor = 1;
    while ((0.299 * r + 0.587 * g + 0.114 * b) > 120 && factor > 0.1) {
      factor -= 0.05;
      r = Math.round(r * (1 - 0.05));
      g = Math.round(g * (1 - 0.05));
      b = Math.round(b * (1 - 0.05));
    }
    const toHex = (v) => v.toString(16).padStart(2, '0');
    return { hex: '#' + toHex(r) + toHex(g) + toHex(b), adjusted: factor < 1 };
  }

  genBtn.addEventListener('click', () => {
    errorMsg.classList.add('hidden');
    const text = qrText.value.trim();
    if (!text) {
      errorMsg.textContent = 'Please enter some text or a link.';
      errorMsg.classList.remove('hidden');
      return;
    }

    const safe = ensureScannableColor(qrColor.value);
    if (safe.adjusted) {
      errorMsg.textContent = 'Note: your chosen colour was too light to scan reliably, so it was automatically darkened for this QR code.';
      errorMsg.classList.remove('hidden');
    }

    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, {
      text: text,
      width: parseInt(qrSize.value),
      height: parseInt(qrSize.value),
      colorDark: safe.hex,
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    resultCard.classList.remove('hidden');
    resultCard.scrollIntoView({ behavior: 'smooth' });
  });

  downloadBtn.addEventListener('click', () => {
    const srcCanvas = qrCanvas.querySelector('canvas');
    if (!srcCanvas) {
      errorMsg.textContent = 'Please generate a QR code first.';
      errorMsg.classList.remove('hidden');
      return;
    }

    const size = 2048;
    const out = document.createElement('canvas');
    out.width = size;
    out.height = size;

    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    const margin = Math.round(size * 0.08);
    ctx.drawImage(srcCanvas, margin, margin, size - margin * 2, size - margin * 2);

    const link = document.createElement('a');
    link.download = 'nidar_qrcode.png';
    link.href = out.toDataURL('image/png');
    link.click();
  });
})();
</script>

</body>
</html>
